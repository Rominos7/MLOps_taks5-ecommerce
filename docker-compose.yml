services:
  chat-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile  # якщо Dockerfile є в docker/; або просто Dockerfile в корені
    ports:
      - "8501:8501"
    volumes:
      - .:/app                # монтуємо весь проєкт
      - ./data:/app/data      # явно монтуємо data/, щоб контейнер бачив твої CSV
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models/recommendation_model.pkl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
